[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "1.0.0"
description = "Multi-signal phishing URL detection prototype combining host ML, content inspection, OSINT, and threat intelligence."
readme = "README.md"
authors = [
    { name = "Shrey Nagpatney" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "joblib>=1.3",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=6.0",
]
advanced = [
    "xgboost>=2.0",
    "python-whois>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["phishguard*"]
